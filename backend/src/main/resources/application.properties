spring.application.name=nexverify-backend

server.port=8080
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nexverify
spring.datasource.username=nexverify_user
spring.datasource.password=nexverify@jehi06
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# UUID handling
spring.jpa.properties.hibernate.id.uuid_generator_strategy=org.hibernate.id.uuid.UuidGenerator

# JSONB support
spring.jpa.properties.hibernate.types.jackson.object-mapper=com.fasterxml.jackson.databind.ObjectMapper

# QR Code points
app.qr.points.success=50
app.qr.points.fraud=0

# Security (temporary for development)
spring.security.enabled=false

# QR Code Configuration
spring.qrcode.base-url=https://app.nexverify.com/v1/verify
spring.qrcode.points-per-scan=50

# Security (temporary)
#spring.security.jwt.secret=nexverify-secret-key-2025
#spring.security.jwt.expiration=86400000

# Logging
logging.level.com.nexverify=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE